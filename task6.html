

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Registration Form</title>
</head>
<body>
<h1>Student Registration Form</h1>
<form action="#" method="post">
  <p><label for="name">Name</label><br>
  <input type="text" id="name" name="name" required></p>
 
  <p><label for="email">Email</label><br>
  <input type="email" id="email" name="email" required></p>
 
  <p><label for="password">Password</label><br>
  <input type="password" id="password" name="password" required></p>
 
  <fieldset>
    <legend>Gender</legend>
    <input type="radio" id="male" name="gender" value="male"><label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female"><label for="female">Female</label>
    <input type="radio" id="other" name="gender" value="other"><label for="other">Other</label>
  </fieldset>
  <br>
  <fieldset>
    <legend>Interests</legend>
    <input type="checkbox" id="coding" name="interests" value="coding"><label for="coding">Coding</label>
    <input type="checkbox" id="music" name="interests" value="music"><label for="music">Music</label>
    <input type="checkbox" id="sports" name="interests" value="sports"><label for="sports">Sports</label>
    <input type="checkbox" id="reading" name="interests" value="reading"><label for="reading">Reading</label>
  </fieldset>
 
  <p><label for="dept">Department</label><br>
  <select id="dept" name="department">
    <option value="">-- Select --</option>
    <option value="bit">BIT</option>
    <option value="bbs">BBS</option>
    <option value="bca">BCA</option>
  </select></p>
 
  <p><label for="about">About You</label><br>
  <textarea id="about" name="about" rows="5" cols="40"></textarea></p>
 
  <p><button type="submit">Submit</button></p>
</form>
</body>
</html>
